name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Placeholder values: CI only checks that the app builds
          VITE_BASE44_APP_ID: 000000000000000000000000
          VITE_BASE44_APP_BASE_URL: https://example.base44.app
